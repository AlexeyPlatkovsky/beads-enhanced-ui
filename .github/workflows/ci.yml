name: PR Smoke

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/ci.yml'
      - 'app/**'
      - 'server/**'
      - 'bin/**'
      - 'scripts/**'
      - 'test/**'
      - 'types/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.mjs'
      - 'eslint.config.js'
      - 'prettier.config.js'
      - '.prettierignore'
      - '.editorconfig'

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Coverage
        id: coverage
        run: npm run test:coverage
        continue-on-error: true
      - name: Post coverage comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const passed = '${{ steps.coverage.outcome }}' === 'success';

            let summary;
            try {
              summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            } catch (e) {
              core.warning('Could not read coverage summary: ' + e.message);
              return;
            }

            const t = summary.total;
            const fmt = (n) => n.toFixed(1) + '%';
            const icon = (pct, threshold) => pct >= threshold ? '✅' : '❌';
            const thresholds = { lines: 65, functions: 65, branches: 55, statements: 65 };

            const body = [
              '<!-- coverage-report -->',
              `## Coverage — ${passed ? '✅ PASS' : '❌ FAIL'}`,
              `**Overall: ${fmt(t.statements.pct)}** (statements)`,
              '',
              '| Metric | Coverage | Threshold | |',
              '|--------|----------|-----------|---|',
              `| Lines | ${fmt(t.lines.pct)} | ${thresholds.lines}% | ${icon(t.lines.pct, thresholds.lines)} |`,
              `| Functions | ${fmt(t.functions.pct)} | ${thresholds.functions}% | ${icon(t.functions.pct, thresholds.functions)} |`,
              `| Branches | ${fmt(t.branches.pct)} | ${thresholds.branches}% | ${icon(t.branches.pct, thresholds.branches)} |`,
              `| Statements | ${fmt(t.statements.pct)} | ${thresholds.statements}% | ${icon(t.statements.pct, thresholds.statements)} |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes('<!-- coverage-report -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Enforce coverage thresholds
        if: steps.coverage.outcome == 'failure'
        run: exit 1
